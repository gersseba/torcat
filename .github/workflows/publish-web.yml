name: Publish Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-web
  cancel-in-progress: false

permissions: {}

jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check_head.outputs.publish }}
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Cache Godot and Web template
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-4.7.2-stable-linux-x86_64-web-release-v1

      - name: Install Godot 4.7.2 and matching Web template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/godot/data
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl --fail --location --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot-linux.zip"
          curl --fail --location --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot-templates.tpz"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot-linux.zip" | sha256sum -c -
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/godot-templates.tpz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/godot/bin" "$XDG_DATA_HOME/godot/export_templates/4.7.2.stable"
          unzip -q "$RUNNER_TEMP/godot-linux.zip" -d "$RUNNER_TEMP/godot/bin"
          unzip -q -j "$RUNNER_TEMP/godot-templates.tpz" templates/web_nothreads_release.zip -d "$XDG_DATA_HOME/godot/export_templates/4.7.2.stable"
          chmod +x "$RUNNER_TEMP/godot/bin/Godot_v4.7.2-stable_linux.x86_64"

      - name: Import and export the project
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/godot/data
        shell: bash
        run: |
          set -euo pipefail
          godot="$RUNNER_TEMP/godot/bin/Godot_v4.7.2-stable_linux.x86_64"
          mkdir -p "$RUNNER_TEMP/web-export"
          "$godot" --headless --path . --editor --import
          "$godot" --headless --path . --export-release Web "$RUNNER_TEMP/web-export/index.html"
          for file in index.html index.js index.wasm index.pck; do
            test -s "$RUNNER_TEMP/web-export/$file"
          done

      - name: Check that main has not advanced
        id: check_head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::Main advanced while exporting; a newer run will publish it."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: steps.check_head.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/web-export

  deploy:
    needs: export
    if: needs.export.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
